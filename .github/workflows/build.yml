name: Build WiFi Login AMR

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: '构建后创建 Release 并上传 AMR'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            cmake \
            make
          sudo rm -rf /var/lib/apt/lists/*

      - name: Cross-compile libjsapi_panet.so (aarch64)
        run: |
          export CROSS_TOOLCHAIN_PREFIX=aarch64-linux-gnu-
          cmake -B build/panet \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_BUILD_TYPE=Release \
            native/panet
          cmake --build build/panet --parallel $(nproc)
          mkdir -p ui/libs
          cp -f build/panet/libjsapi_panet.so ui/libs/libjsapi_panet.so
          file ui/libs/libjsapi_panet.so
          aarch64-linux-gnu-readelf -h ui/libs/libjsapi_panet.so | grep -E 'Class|Machine'
          aarch64-linux-gnu-readelf -d ui/libs/libjsapi_panet.so | grep NEEDED
          aarch64-linux-gnu-nm -D ui/libs/libjsapi_panet.so | grep custom_init_jsapis

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        run: npm install -g pnpm@10.12.4

      - name: Install dependencies
        run: pnpm install -C ./ui

      - name: Package AMR (production quickjs)
        run: pnpm -C ui package

      - name: Collect AMR
        run: |
          mkdir -p out
          find . -name '*.amr' -type f
          find . -name '*.amr' -type f -exec cp -f {} ./out/ \;
          ls -la out/

      - name: Upload AMR artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifi-login-amr
          path: ./out/*.amr
          if-no-files-found: error
          retention-days: 30

      # ---- Release ----
      # 触发条件: 打了 v* 标签, 或手动运行时勾选 release。
      # 版本号以 ui/package.json 为准, 与 APP_VERSION 保持一致。
      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            V=$(node -p "require('./ui/package.json').version")
            TAG="v${V}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "版本号: ${TAG}"

      - name: Check release needed
        id: need
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]] || [[ "${{ inputs.release }}" == "true" ]]; then
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "Release $TAG 已存在, 将更新产物"
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "将创建 Release $TAG"
            fi
          else
            echo "exists=skip" >> "$GITHUB_OUTPUT"
            echo "本次不发布 Release"
          fi

      - name: Extract release notes from CHANGELOG
        if: steps.need.outputs.exists != 'skip'
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          VER="${TAG#v}"
          # 注意: 用 --notes-file 传文件, 不能用 --notes "$var" ——
          # 反引号内容会被 shell 当成命令替换执行, 导致代码片段被吞掉。
          {
            # 抽取 CHANGELOG.md 中该版本的段落 (到下一个 ## 或 [x.y.z]: 链接定义为止)
            awk -v v="$VER" '
              $0 ~ "^## \\[" v "\\]" { found=1; print "# " TAGNAME; next }
              found && /^## / { exit }
              found && /^\[/ { exit }
              found { print }
            ' TAGNAME="$TAG" CHANGELOG.md
            echo ''
            echo '---'
            echo ''
            echo "由 GitHub Actions 自动发布 · commit \`${GITHUB_SHA::7}\`"
          } > release-notes.md
          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: Create or update Release
        if: steps.need.outputs.exists != 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.need.outputs.exists }}" == "true" ]]; then
            gh release upload "$TAG" out/*.amr --repo "$GITHUB_REPOSITORY" --clobber
            # 同步刷新说明文字 (CHANGELOG 可能已更新, upload 不会改 notes)
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create "$TAG" out/*.amr \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --latest
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
